<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner de Conversión — Envíos DosRuedas</title>

  <!-- Google Fonts Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Bebas+Neue&family=Geist+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --color-brand-blue-50: #E6EEFE;
      --color-brand-blue-100: #BACEFD;
      --color-brand-blue-200: #8EAFFB;
      --color-brand-blue-300: #628FF9;
      --color-brand-blue-400: #3570F8;
      --color-brand-blue-500: #0950F6;

      --color-brand-yellow-50: #FFFDE6;
      --color-brand-yellow-100: #FFFAB8;
      --color-brand-yellow-200: #FFF78A;
      --color-brand-yellow-300: #FFF45C;
      --color-brand-yellow-400: #FFF12E;
      --color-brand-yellow-500: #FFEC01;
      --color-brand-yellow-600: #E6D400;

      --color-white: #FFFFFF;

      --font-sans: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Anton SC", "Anton", Impact, sans-serif;
      --font-subheading: "Bebas Neue", sans-serif;
      --font-mono: "Geist Mono", monospace;

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --duration-feedback: 160ms;
      --shadow-accent-sm: 0 2px 6px rgba(255, 236, 1, 0.25);
      --shadow-cta-glow: 0 0 28px rgba(255, 236, 1, 0.45), 0 8px 24px rgba(9, 80, 246, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: #F8FAFC;
      color: var(--color-brand-blue-500);
      line-height: 1.5;
      padding: 3rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-wrapper {
      width: 100%;
      max-width: 1100px;
    }

    /* Double Bezel Card Dark */
    .banner-outer-bezel {
      background-color: rgba(9, 80, 246, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 48px -8px rgba(9, 80, 246, 0.35);
    }

    .banner-inner-card {
      background-color: var(--color-brand-blue-500);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 3rem 1.5rem;
      position: relative;
      text-align: center;
      color: var(--color-white);
      z-index: 2;
    }

    @media (min-width: 640px) {
      .banner-inner-card {
        padding: 4rem 2.5rem;
      }
    }
    @media (min-width: 1024px) {
      .banner-inner-card {
        padding: 4.5rem 3rem;
      }
    }

    /* Marca de agua decorativa */
    .watermark-icon {
      position: absolute;
      right: -30px;
      bottom: -30px;
      width: 280px;
      height: 280px;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
      z-index: 1;
    }

    .banner-content {
      position: relative;
      z-index: 3;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* Badge Eyebrow */
    .banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background-color: rgba(255, 236, 1, 0.12);
      border: 1px solid rgba(255, 236, 1, 0.4);
      transform: rotate(-1deg);
      box-shadow: 0 0 16px rgba(255, 236, 1, 0.25);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--color-brand-yellow-500);
      box-shadow: 0 0 8px #FFEC01;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .badge-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-brand-yellow-500);
      font-variant-numeric: tabular-nums;
    }

    /* Titular */
    .banner-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 0.98;
      text-transform: uppercase;
      letter-spacing: -0.025em;
      color: var(--color-white);
      text-wrap: balance;
    }

    /* Párrafo */
    .banner-description {
      font-size: clamp(1rem, 1.3vw, 1.1875rem);
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.88);
      max-width: 60ch;
    }

    /* Grupo de Botones CTA */
    .banner-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding-top: 0.75rem;
    }

    @media (min-width: 640px) {
      .banner-actions {
        flex-direction: row;
        justify-content: center;
        gap: 1.25rem;
        width: auto;
      }
    }

    /* CTANestedPill */
    .cta-nested-pill {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 10px 0 24px;
      border-radius: 9999px;
      font-family: var(--font-subheading);
      font-size: 1.125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: all var(--duration-feedback) var(--ease-out);
      width: 100%;
      max-width: 300px;
    }

    @media (min-width: 640px) {
      .cta-nested-pill {
        width: auto;
        min-width: 220px;
      }
    }

    .pill-arrow-disc {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 14px;
      transition: transform var(--duration-feedback) var(--ease-out);
    }

    /* Variante Primaria: Amarillo de alta visibilidad */
    .pill-primary {
      background-color: var(--color-brand-yellow-500);
      color: var(--color-brand-blue-500);
      border: 1px solid var(--color-brand-yellow-500);
      box-shadow: var(--shadow-accent-sm);
    }

    .pill-primary .pill-arrow-disc {
      background-color: var(--color-brand-blue-500);
      color: var(--color-brand-yellow-500);
    }

    .pill-primary:hover {
      background-color: var(--color-brand-yellow-400);
      box-shadow: var(--shadow-cta-glow);
      transform: translateY(-2px);
    }

    .pill-primary:hover .pill-arrow-disc {
      transform: translateX(3px);
    }

    /* Variante Outline: Borde blanco translúcido */
    .pill-outline {
      background-color: transparent;
      color: var(--color-white);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    .pill-outline .pill-arrow-disc {
      background-color: rgba(255, 255, 255, 0.12);
      color: var(--color-white);
    }

    .pill-outline:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--color-brand-yellow-500);
      color: var(--color-brand-yellow-500);
      transform: translateY(-2px);
    }

    .pill-outline:hover .pill-arrow-disc {
      background-color: var(--color-brand-yellow-500);
      color: var(--color-brand-blue-500);
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <div class="banner-wrapper">
    <section aria-labelledby="conversion-heading">
      <div class="banner-outer-bezel">
        <!-- Marca de agua decorativa de fondo -->
        <svg class="watermark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>

        <div class="banner-inner-card">
          <div class="banner-content">

            <!-- Eyebrow Tag -->
            <div class="banner-badge">
              <span class="pulse-dot" aria-hidden="true"></span>
              <span class="badge-text">Operaciones Activas Mar del Plata 2026</span>
            </div>

            <!-- Titular Display -->
            <h2 id="conversion-heading" class="banner-title">
              ¿Tenés envíos para hoy? Los entregamos a tiempo.
            </h2>

            <!-- Párrafo descriptivo -->
            <p class="banner-description">
              Cotizá online en segundos o coordiná directo con nuestro equipo logístico por WhatsApp.
            </p>

            <!-- Acciones CTA -->
            <div class="banner-actions">
              <a href="/cotizar" class="cta-nested-pill pill-primary">
                <span>Cotizá tu Envío</span>
                <span class="pill-arrow-disc" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </span>
              </a>

              <a
                href="https://api.whatsapp.com/send/?phone=542236602699&text=Hola!%20Quiero%20coordinar%20mis%20env%C3%ADos%20de%20hoy."
                target="_blank"
                rel="noopener noreferrer"
                class="cta-nested-pill pill-outline"
              >
                <span>Chateá con Nosotros</span>
                <span class="pill-arrow-disc" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </span>
              </a>
            </div>

          </div>
        </div>
      </div>
    </section>
  </div>

</body>
</html>
