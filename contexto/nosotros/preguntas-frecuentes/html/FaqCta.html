<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTA Preguntas Frecuentes | Envíos DosRuedas Mar del Plata</title>
  <meta name="description" content="¿No encontraste lo que buscabas? Nuestro equipo de soporte en Mar del Plata responde todas tus consultas por WhatsApp o contacto directo.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Bebas+Neue&family=Geist+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-brand-blue: #0950F6;
      --color-brand-blue-dark: #073ec2;
      --color-brand-blue-50: #E6EEFE;
      --color-brand-blue-100: #BACEFD;
      --color-brand-yellow: #FFEC01;
      --color-brand-yellow-hover: #FFF12E;
      --color-brand-white: #FFFFFF;
      --color-text-main: #FFFFFF;
      --color-text-muted: rgba(255, 255, 255, 0.9);

      --font-display: 'Anton SC', sans-serif;
      --font-subheading: 'Bebas Neue', sans-serif;
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-brand-blue);
      color: var(--color-text-main);
      padding: 3rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cta-section {
      width: 100%;
      max-width: 68rem;
      margin-inline: auto;
      position: relative;
    }

    /* Double Bezel Outer Container */
    .double-bezel-outer {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 236, 1, 0.15));
      padding: 0.625rem;
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .double-bezel-inner {
      background-color: var(--color-brand-blue);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1.25rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .double-bezel-inner {
        padding: 3.5rem 2.5rem;
      }
    }

    @media (min-width: 1024px) {
      .double-bezel-inner {
        padding: 4.5rem 3.5rem;
      }
    }

    /* Abstract Watermark Background Icon */
    .watermark-icon {
      position: absolute;
      right: -2rem;
      bottom: -2rem;
      width: 18rem;
      height: 18rem;
      color: #FFFFFF;
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
    }

    @media (min-width: 640px) {
      .watermark-icon {
        width: 22rem;
        height: 22rem;
        right: -1rem;
        bottom: -1rem;
      }
    }

    .cta-content {
      position: relative;
      z-index: 10;
      max-width: 44rem;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* Yellow Badge */
    .badge-accent {
      display: inline-block;
      padding: 0.375rem 1.125rem;
      background-color: var(--color-brand-yellow);
      color: var(--color-brand-blue);
      border-radius: 9999px;
      font-family: var(--font-subheading);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transform: rotate(-1deg);
      box-shadow: 0 4px 14px rgba(255, 236, 1, 0.35);
    }

    /* Title */
    .cta-title {
      font-family: var(--font-display);
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #FFFFFF;
    }

    @media (min-width: 640px) {
      .cta-title {
        font-size: 2.75rem;
      }
    }

    @media (min-width: 1024px) {
      .cta-title {
        font-size: 3.25rem;
      }
    }

    /* Lead Text */
    .cta-lead {
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      line-height: 1.65;
      color: var(--color-text-muted);
      max-width: 38rem;
    }

    @media (min-width: 640px) {
      .cta-lead {
        font-size: 1.0625rem;
      }
    }

    /* Buttons Container */
    .buttons-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      padding-top: 0.75rem;
    }

    @media (min-width: 640px) {
      .buttons-group {
        flex-direction: row;
        gap: 1.25rem;
      }
    }

    /* Primary Pill */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-height: 3.25rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      background-color: var(--color-brand-yellow);
      color: var(--color-brand-blue);
      font-family: var(--font-subheading);
      font-size: 1.125rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--color-brand-yellow-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 236, 1, 0.4);
    }

    .btn-primary:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--color-brand-yellow), 0 0 0 6px var(--color-brand-blue);
    }

    /* Outline Pill */
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      border: 2px solid #FFFFFF;
      background-color: transparent;
      color: #FFFFFF;
      font-family: var(--font-subheading);
      font-size: 1.125rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: var(--color-brand-yellow);
      color: var(--color-brand-yellow);
      transform: translateY(-2px);
    }

    .btn-outline:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px var(--color-brand-blue);
    }

    .svg-icon {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <section id="faq-cta" class="cta-section" aria-label="Llamado a la acción para dudas adicionales">
    
    <div class="double-bezel-outer">
      <div class="double-bezel-inner">

        <!-- Watermark Background Graphic -->
        <svg class="watermark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>

        <div class="cta-content">
          
          <!-- Badge -->
          <span class="badge-accent">
            SOPORTE HUMANO EN MDP
          </span>

          <!-- Heading -->
          <h2 class="cta-title">
            ¿NO ENCONTRASTE LO QUE BUSCABAS?
          </h2>

          <!-- Description -->
          <p class="cta-lead">
            No te preocupes. Nuestro equipo de soporte está listo para ayudarte de inmediato con cualquier consulta específica que tengas sobre nuestros servicios de mensajería y delivery en Mar del Plata.
          </p>

          <!-- Buttons -->
          <div class="buttons-group">
            <a
              href="https://api.whatsapp.com/send/?phone=542236602699&text=Hola,%20tengo%20una%20consulta%20que%20no%20encontr%C3%A9%20en%20las%20FAQ"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-primary"
            >
              <svg class="svg-icon" viewBox="0 0 448 512" aria-hidden="true">
                <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
              </svg>
              <span>Hablá por WhatsApp</span>
            </a>

            <a href="/contacto" class="btn-outline">
              Contacto Directo
            </a>
          </div>

        </div>

      </div>
    </div>

  </section>

</body>
</html>
