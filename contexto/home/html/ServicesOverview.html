<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServicesOverview — Envíos DosRuedas Mar del Plata</title>
  <meta name="description"
    content="Soluciones logísticas a tu medida en Mar del Plata: Envíos Express en 3 hs, LowCost programado, Mercado Envíos Flex y Almacenamiento Same Day." />

  <!-- Google Fonts Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Bebas+Neue&family=Geist+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="./css/globals.css" />
  <link rel="stylesheet" href="./css/services-overview.css" />
</head>

<body>
  <section id="services-overview" aria-labelledby="services-overview-title" class="services-section">
    <canvas id="network-canvas" aria-hidden="true"></canvas>
    <div class="ambient-glow-top" aria-hidden="true"></div>
    <div class="ambient-glow-bottom" aria-hidden="true"></div>
    <div class="section-container" role="region" aria-roledescription="carousel" aria-label="Servicios logísticos">
      <div class="services-header">
        <div>
          <span class="header-badge">NUESTROS SERVICIOS</span>
          <h2 id="services-overview-title" class="header-title">
            SOLUCIONES LOGÍSTICAS <br />
            <span class="title-highlight">A TU MEDIDA</span>
          </h2>
        </div>
        <div class="header-controls">
          <button type="button" id="toggle-rotate" class="btn-toggle-rotate active" aria-pressed="true">ROTACIÓN
            AUTOMÁTICA</button>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="prev-service" class="btn-nav-round" aria-label="Anterior Servicio"><svg
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"></path>
              </svg></button>
            <button type="button" id="next-service" class="btn-nav-round" aria-label="Siguiente Servicio"><svg
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6"></path>
              </svg></button>
          </div>
        </div>
      </div>
      <div id="carousel-stage" class="carousel-stage">
        <button type="button" class="service-card-wrapper" data-index="0"
          aria-label="Ver ficha técnica de Envíos Express">
          <div class="service-card-inner card-theme-express">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <div class="card-top">
              <div class="card-icon-pill">
                <div class="icon-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                  </svg></div>
                <span class="card-badge">URGENTE</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg><span>Todo Mar del Plata</span></div>
              <h3 class="card-title">Envíos Express</h3>
              <p class="card-desc">Mensajería en moto con franja horaria de 3 hs a elección.</p>
            </div>
            <div class="card-stats-grid">
              <div class="stat-box">
                <div class="stat-val">3 horas</div>
                <div class="stat-lbl">ENTREGA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">$3.500 Base</div>
                <div class="stat-lbl">TARIFA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">Hasta 5 kg</div>
                <div class="stat-lbl">PESO</div>
              </div>
            </div>
            <span class="card-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
              </svg>Mirá la Ficha Técnica</span>
          </div>
        </button>
        <button type="button" class="service-card-wrapper" data-index="1"
          aria-label="Ver ficha técnica de Envíos LowCost">
          <div class="service-card-inner card-theme-lowcost">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7.5 4.27 9 5.15"></path>
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z">
              </path>
              <path d="m3.3 7 8.7 5 8.7-5"></path>
              <path d="M12 22V12"></path>
            </svg>
            <div class="card-top">
              <div class="card-icon-pill">
                <div class="icon-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7.5 4.27 9 5.15"></path>
                    <path
                      d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z">
                    </path>
                    <path d="m3.3 7 8.7 5 8.7-5"></path>
                    <path d="M12 22V12"></path>
                  </svg></div>
                <span class="card-badge">ECONÓMICO</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg><span>Todo Gral. Pueyrredón</span></div>
              <h3 class="card-title">Envíos LowCost</h3>
              <p class="card-desc">Envíos económicos programados en el día, sin elección de horario.</p>
            </div>
            <div class="card-stats-grid">
              <div class="stat-box">
                <div class="stat-val">En el día</div>
                <div class="stat-lbl">ENTREGA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">$2.800 Base</div>
                <div class="stat-lbl">TARIFA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">Hasta 5 kg</div>
                <div class="stat-lbl">PESO</div>
              </div>
            </div>
            <span class="card-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
              </svg>Mirá la Ficha Técnica</span>
          </div>
        </button>
        <button type="button" class="service-card-wrapper" data-index="2" aria-label="Ver ficha técnica de Envíos Flex">
          <div class="service-card-inner card-theme-flex">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
              <path d="M15 18H9"></path>
              <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
              <circle cx="17" cy="18" r="2"></circle>
              <circle cx="7" cy="18" r="2"></circle>
            </svg>
            <div class="card-top">
              <div class="card-icon-pill">
                <div class="icon-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
                    <path d="M15 18H9"></path>
                    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
                    <circle cx="17" cy="18" r="2"></circle>
                    <circle cx="7" cy="18" r="2"></circle>
                  </svg></div>
                <span class="card-badge">MERCADOLIBRE FLEX</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg><span>Mar del Plata urbana</span></div>
              <h3 class="card-title">Envíos Flex</h3>
              <p class="card-desc">Entregas en el día integradas para tus ventas de MercadoLibre.</p>
            </div>
            <div class="card-stats-grid">
              <div class="stat-box">
                <div class="stat-val">En el día</div>
                <div class="stat-lbl">ENTREGA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">Zonificado</div>
                <div class="stat-lbl">TARIFA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">Moto / Auto</div>
                <div class="stat-lbl">PESO</div>
              </div>
            </div>
            <span class="card-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
              </svg>Mirá la Ficha Técnica</span>
          </div>
        </button>
        <button type="button" class="service-card-wrapper" data-index="3"
          aria-label="Ver ficha técnica de E-Commerce Same Day">
          <div class="service-card-inner card-theme-3pl">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3v18h18"></path>
              <path d="M7 17V9"></path>
              <path d="M11 17V5"></path>
              <path d="M15 17v-4"></path>
              <path d="M19 17v-8"></path>
            </svg>
            <div class="card-top">
              <div class="card-icon-pill">
                <div class="icon-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"></path>
                    <path d="M5 21V7l8-4v18"></path>
                    <path d="M19 21V11l-6-4"></path>
                    <path d="M9 9h1"></path>
                    <path d="M9 13h1"></path>
                    <path d="M9 17h1"></path>
                  </svg></div>
                <span class="card-badge">E-COMMERCE</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg><span>Depósito Friuli 1972</span></div>
              <h3 class="card-title">E-Commerce Same Day</h3>
              <p class="card-desc">Guardamos tu stock y lo despachamos el mismo día a toda la ciudad.</p>
            </div>
            <div class="card-stats-grid">
              <div class="stat-box">
                <div class="stat-val">Same Day</div>
                <div class="stat-lbl">ENTREGA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">$2.900 Fijo</div>
                <div class="stat-lbl">TARIFA</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">Sin límite</div>
                <div class="stat-lbl">PESO</div>
              </div>
            </div>
            <span class="card-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
              </svg>Mirá la Ficha Técnica</span>
          </div>
        </button>
      </div>
      <div id="carousel-indicators" class="carousel-indicators">
        <button type="button" class="indicator-btn active" data-index="0"
          aria-label="Ir al servicio Envíos Express"><span class="indicator-dot"></span></button>
        <button type="button" class="indicator-btn" data-index="1" aria-label="Ir al servicio Envíos LowCost"><span
            class="indicator-dot"></span></button>
        <button type="button" class="indicator-btn" data-index="2" aria-label="Ir al servicio Envíos Flex"><span
            class="indicator-dot"></span></button>
        <button type="button" class="indicator-btn" data-index="3" aria-label="Ir al servicio E-Commerce Same Day"><span
            class="indicator-dot"></span></button>
      </div>
    </div>
    <div id="service-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-outer">
        <div class="modal-inner">
          <button type="button" id="modal-close" class="btn-close-modal" aria-label="Cerrar ficha técnica">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <div class="modal-header-box">
            <div id="modal-icon" class="modal-icon-badge"></div>
            <div>
              <span id="modal-meta" class="modal-header-meta">+7 Años de Trayectoria · Todo Mar del Plata</span>
              <h3 id="modal-title" class="modal-header-title">Envíos Express</h3>
            </div>
          </div>
          <div class="modal-body-box">
            <p id="modal-summary" class="modal-summary">Servicio de mensajería urbana con horario a elección...</p>
            <div class="modal-features-list">
              <span
                style="font-size: 0.75rem; font-family: var(--font-subheading); color: var(--color-brand-yellow-500); font-weight: 700; text-transform: uppercase;">Beneficios
                Clave:</span>
              <div id="modal-features"></div>
            </div>
          </div>
          <div class="modal-stats-grid">
            <div class="modal-stat-card"><span id="stat-time" class="modal-stat-value accent">3 horas</span><span
                class="modal-stat-label">Tiempos</span></div>
            <div class="modal-stat-card"><span id="stat-price" class="modal-stat-value" style="color: #FFFFFF;">$3.500
                Base</span><span class="modal-stat-label">Precio Base</span></div>
            <div class="modal-stat-card"><span id="stat-weight" class="modal-stat-value accent">Hasta 5 kg</span><span
                class="modal-stat-label">Capacidad</span></div>
          </div>
          <div class="modal-footer">
            <button type="button" id="modal-back" class="btn-modal-back">Volver Atrás</button>
            <a href="/cotizar" id="modal-cta" class="btn-modal-cta">
              <span id="modal-cta-text">COTIZÁ TU EXPRESS</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Script Modular -->
  <script src="./js/services-overview.js" defer></script>
</body>

</html>
