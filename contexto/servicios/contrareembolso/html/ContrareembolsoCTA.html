  <!-- Google Fonts Preconnect & Styles -->

  <style>
    :root {
      --color-brand-blue-500: #0950F6;
      --color-brand-blue-400: #3570F8;
      --color-brand-blue-100: #BACEFD;
      --color-brand-yellow-500: #FFEC01;

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --duration-ui: 180ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--color-brand-blue-500); color: var(--color-white); line-height: 1.5; -webkit-font-smoothing: antialiased; }

    .cta-section {
      padding-block: 4.5rem;
      background-color: var(--color-brand-blue-500);
      color: var(--color-white);
      text-align: center;
    }

    .container {
      max-width: 48rem;
      margin-inline: auto;
      padding-inline: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .cta-title {
      font-family: var(--font-display);
      font-size: 2.25rem;

    .cta-desc {

      color: var(--color-brand-blue-100);
      max-width: 36rem;
    }
    @media (min-width: 640px) { .cta-desc { font-size: 1.125rem; } }

    .btn-wa-cta {

      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background-color: var(--color-brand-yellow-500);
      color: var(--color-brand-blue-500);
      font-family: var(--font-subheading);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.875rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255, 236, 1, 0.4);
      min-height: 48px;
      transition: all var(--duration-ui) var(--ease-out);
    }
    .btn-wa-cta:hover {
      background-color: var(--color-brand-yellow-400);
      transform: translateY(-2px);
    }
  </style>
</head>

</body>
