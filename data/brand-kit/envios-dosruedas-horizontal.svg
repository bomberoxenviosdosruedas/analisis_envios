<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256">
  <title>Envios DosRuedas - Lockup Horizontal</title>
  <g transform="translate(10, 0) scale(0.85)">
    <!-- Rueda Trasera -->
    <path fill-rule="evenodd" fill="#0950F6" d="
      M 68 116
      A 44 44 0 1 0 68 204
      A 44 44 0 1 0 68 116 Z
      M 68 138
      A 22 22 0 1 1 68 182
      A 22 22 0 1 1 68 138 Z" />
    <circle cx="68" cy="160" r="10" fill="#FFEC01" />

    <!-- Rueda Delantera -->
    <path fill-rule="evenodd" fill="#0950F6" d="
      M 188 116
      A 44 44 0 1 0 188 204
      A 44 44 0 1 0 188 116 Z
      M 188 138
      A 22 22 0 1 1 188 182
      A 22 22 0 1 1 188 138 Z" />
    <circle cx="188" cy="160" r="10" fill="#FFEC01" />

    <!-- Chasis y flecha aerodinamica -->
    <path fill="#0950F6" d="M 40 102 L 138 102 L 176 64 L 78 64 Z" />
    <path fill="#FFEC01" d="M 124 64 L 186 64 L 224 102 L 162 102 Z" />

    <!-- Estela inferior -->
    <path fill="#0950F6" d="M 80 128 L 176 128 L 156 148 L 60 148 Z" />
    <path fill="#FFEC01" d="M 166 128 L 216 128 L 196 148 L 146 148 Z" />
  </g>

  <!-- Tipografía del Lockup Horizontal -->
  <g transform="translate(235, 145)">
    <text x="0" y="-15" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#0950F6" letter-spacing="3">ENVÍOS</text>
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0c3ba7" letter-spacing="1">DOSRUEDAS</text>
    <rect x="0" y="42" width="280" height="6" fill="#FFEC01" />
  </g>
</svg>
