<body>
  <section id="services-overview" aria-labelledby="services-overview-title" class="services-section">
    <canvas id="network-canvas" aria-hidden="true"></canvas>
    <div class="ambient-glow-top" aria-hidden="true"></div>
    <div class="ambient-glow-bottom" aria-hidden="true"></div>
    <div class="section-container" role="region" aria-roledescription="carousel" aria-label="Servicios logísticos">
      <div class="services-header">
        <div>
          <span class="header-badge">NUESTROS SERVICIOS</span>
          <h2 id="services-overview-title" class="header-title">
            SOLUCIONES LOGÍSTICAS <br />
            <span class="title-highlight">A TU MEDIDA</span>
          </h2>
        </div>
        <div class="header-controls">
          <button type="button" id="toggle-rotate" class="btn-toggle-rotate active" aria-pressed="true">ROTACIÓN AUTOMÁTICA</button>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="prev-service" class="btn-nav-round" aria-label="Anterior Servicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
            <button type="button" id="next-service" class="btn-nav-round" aria-label="Siguiente Servicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
          </div>
        </div>
      </div>
      <div id="carousel-stage" class="carousel-stage">
        <button type="button" class="service-card-wrapper" data-index="0" aria-label="Ver ficha técnica de Envíos Express">
          <div class="service-card-inner card-theme-express">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <div class="card-top">
              <div class="card-icon-pill">
                <div class="icon-square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
                <span class="card-badge">URGENTE</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Todo Mar del Plata</span></div>
              <h3 class="card-title">Envíos Express</h3>
              <p class="card-desc">Mensajería en moto con franja horaria de 3 hs a elección.</p>
            </div>
            <div class="card-stats-grid">
              <div class="stat-box"><div class="stat-val">3 horas</div><div class="stat-lbl">ENTREGA</div></div>
              <div class="stat-box"><div class="stat-val">$3.500 Base</div><div class="stat-lbl">TARIFA</div></div>
              <div class="stat-box"><div class="stat-val">Hasta 5 kg</div><div class="stat-lbl">PESO</div></div>
            </div>
            <span class="card-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>Mirá la Ficha Técnica</span>
          </div>
        </button>
        <button type="button" class="service-card-wrapper" data-index="1" aria-label="Ver ficha técnica de Envíos LowCost">
          <div class="service-card-inner card-theme-lowcost">
            <svg class="card-watermark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>

      const modalClose = document.getElementById('modal-close');
      const modalBack = document.getElementById('modal-back');
      const modalTitle = document.getElementById('modal-title');
      const modalMeta = document.getElementById('modal-meta');
      const modalSummary = document.getElementById('modal-summary');
      const modalFeatures = document.getElementById('modal-features');
      const modalIcon = document.getElementById('modal-icon');
      const statTime = document.getElementById('stat-time');
      const statPrice = document.getElementById('stat-price');
      const statWeight = document.getElementById('stat-weight');
      const modalCta = document.getElementById('modal-cta');
      const modalCtaText = document.getElementById('modal-cta-text');
      let lastActiveTrigger = null;

      function openModal(index) {
        const item = SERVICES_DATA[index]; lastActiveTrigger = document.activeElement;
        modalTitle.innerText = item.title; modalMeta.innerText = item.meta; modalSummary.innerText = item.summary;
        statTime.innerText = item.stats.time; statPrice.innerText = item.stats.price; statWeight.innerText = item.stats.weight;
        modalCtaText.innerText = item.ctaText; modalCta.setAttribute('href', item.ctaHref);
        modalIcon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${item.iconSvg}</svg>`;
        modalFeatures.innerHTML = item.features.map(f => `
          <div class="modal-feature-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></svg>
            <span>${f}</span>
          </div>`).join('');
        modal.classList.add('open'); document.body.style.overflow = 'hidden'; modalClose.focus();
      }
      function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; if (lastActiveTrigger) lastActiveTrigger.focus(); }
      modalClose.addEventListener('click', closeModal); modalBack.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
    })();
  </script>
</body>
</html>
